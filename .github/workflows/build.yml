
name: Samsung Galaxy A21s U-Boot Build

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build.yml"

permissions:
  contents: read

concurrency:
  group: a21s-uboot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build SM-A217F for Exynos 850
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Show runner resources
        run: |
          echo "=== CPU ==="
          nproc
          echo "=== Memory ==="
          free -h
          echo "=== Disk ==="
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            bc \
            bison \
            flex \
            libssl-dev \
            libgnutls28-dev \
            device-tree-compiler \
            python3 \
            python3-dev \
            python3-setuptools \
            python3-pyelftools \
            swig \
            git \
            ccache

      - name: Configure compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: a21s-ccache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            a21s-ccache-${{ runner.os }}-

      - name: Set cache environment
        run: |
          echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"
          ccache --set-config=max_size=2G
          ccache --zero-stats

      - name: Clone Exynos850 U-Boot
        run: |
          git clone --depth=1 \
            https://github.com/samsungexynos850/u-boot.git \
            source

          git -C source rev-parse HEAD \
            | tee source-commit.txt

          git -C source log -1 --format='%s' \
            | tee source-description.txt

      - name: Configure A21s USB host, timer, and automatic boot
        run: |
          set -eu

          env_file=source/board/samsung/e850-96/e850-96.env
          test -f "$env_file"

          if grep -qE '^(boot_targets|bootdelay)=' "$env_file"; then
            echo "::error::Upstream already defines boot_targets or bootdelay."
            exit 1
          fi

          # Scan USB mass storage before MMC and skip the non-responsive prompt.
          cat >> "$env_file" <<'EOF'
          boot_targets=usb mmc
          bootdelay=0
          EOF

          grep -nE '^boot_(targets|delay)=' "$env_file"

          python3 - <<'PYCODE'
          from pathlib import Path

          dts = Path('source/dts/upstream/src/arm64/exynos/exynos850-a217f.dts')
          text = dts.read_text()
          old = '&usbdrd_dwc3 {\n\tdr_mode = "otg";'
          new = '&usbdrd_dwc3 {\n\tdr_mode = "host";'
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one A21s DWC3 OTG mode stanza')
          dts.write_text(text.replace(old, new))
          print(f'Forced U-Boot USB controller to host mode in {dts}')

          timer = Path('source/arch/arm/cpu/armv8/generic_timer.c')
          text = timer.read_text()
          old = "\n".join([
              "unsigned long notrace get_tbclk(void)",
              "{",
              "\tunsigned long cntfrq;",
              "",
              "\tif (IS_ENABLED(CONFIG_ARMV8_CNTFRQ_BROKEN) && gd->arch.timer_rate_hz)",
              "\t\treturn gd->arch.timer_rate_hz;",
              "",
              "\tasm volatile(\"mrs %0, cntfrq_el0\" : \"=r\" (cntfrq));",
              "\treturn cntfrq;",
              "}",
          ])
          new = "\n".join([
              "unsigned long notrace get_tbclk(void)",
              "{",
              "\tif (IS_ENABLED(CONFIG_ARMV8_CNTFRQ_BROKEN) && gd->arch.timer_rate_hz)",
              "\t\treturn gd->arch.timer_rate_hz;",
              "",
              "#if CONFIG_COUNTER_FREQUENCY",
              "\t/* A21s firmware may leave CNTFRQ_EL0 unset; use the board value. */",
              "\treturn CONFIG_COUNTER_FREQUENCY;",
              "#else",
              "\tunsigned long cntfrq;",
              "",
              "\tasm volatile(\"mrs %0, cntfrq_el0\" : \"=r\" (cntfrq));",
              "\treturn cntfrq;",
              "#endif",
              "}",
          ])
          if text.count(old) != 1:
              raise SystemExit('Could not uniquely locate ARM generic timer function')
          timer.write_text(text.replace(old, new))
          print(f'Added configured counter-frequency fallback in {timer}')
          PYCODE

      - name: Inspect Galaxy A21s support
        run: |
          set -eu

          cd source

          echo "=== A21s defconfig ==="
          test -f configs/e850-96_defconfig

          echo "=== A21s Device Tree ==="
          test -f \
            dts/upstream/src/arm64/exynos/exynos850-a217f.dts

          echo "=== Related DTS and configuration files ==="
          find configs dts/upstream/src/arm64/exynos \
            -maxdepth 2 -type f \
            | grep -Ei 'e850-96|a217f|exynos850' \
            | sort \
            | tee ../inspection.log

      - name: Configure U-Boot for A21s
        run: |
          set -euxo pipefail

          cd source

          make O=build e850-96_defconfig

          scripts/config --file build/.config \
            --set-val COUNTER_FREQUENCY 26000000

          scripts/config --file build/.config \
            --disable ENV_IS_IN_MMC \
            --disable CMD_DFU \
            --disable USB_FUNCTION_FASTBOOT \
            --disable FASTBOOT_FLASH \
            --disable FASTBOOT_CMD_OEM_FORMAT

          make O=build olddefconfig

          echo "=== Selected configuration ==="
          grep -E \
            '^(CONFIG_DEFAULT_DEVICE_TREE|CONFIG_COUNTER_FREQUENCY|CONFIG_USB_HOST|CONFIG_USB_STORAGE|CONFIG_USB_XHCI_HCD|CONFIG_USB_XHCI_DWC3|CONFIG_USB_DWC3_GENERIC|CONFIG_PHY_EXYNOS_USBDRD|CONFIG_BOOTMETH_EXTLINUX|CONFIG_ENV_IS_NOWHERE)' \
            build/.config || true

          grep -q \
            '^CONFIG_DEFAULT_DEVICE_TREE="exynos/exynos850-a217f"$' \
            build/.config
          grep -q '^CONFIG_USB_HOST=y$' build/.config
          grep -q '^CONFIG_USB_STORAGE=y$' build/.config
          grep -q '^CONFIG_USB_XHCI_HCD=y$' build/.config
          grep -q '^CONFIG_USB_XHCI_DWC3=y$' build/.config
          grep -q '^CONFIG_USB_DWC3_GENERIC=y$' build/.config
          grep -q '^CONFIG_PHY_EXYNOS_USBDRD=y$' build/.config
          grep -q '^CONFIG_COUNTER_FREQUENCY=26000000$' build/.config
          grep -q '^CONFIG_BOOTMETH_EXTLINUX=y$' build/.config
          grep -q '^CONFIG_ENV_IS_NOWHERE=y$' build/.config
          grep -q '^CONFIG_BOOTCOMMAND="bootflow scan -lb"$' build/.config
          ! grep -q '^CONFIG_ENV_IS_IN_MMC=y$' build/.config
          ! grep -q '^CONFIG_CMD_DFU=y$' build/.config
          ! grep -q '^CONFIG_USB_FUNCTION_FASTBOOT=y$' build/.config
          ! grep -q '^CONFIG_FASTBOOT_FLASH=y$' build/.config

      - name: Build U-Boot
        run: |
          set -euxo pipefail

          cd source

          make O=build \
            CROSS_COMPILE=aarch64-linux-gnu- \
            -j"$(nproc)"

          echo "=== Verify embedded autoboot defaults ==="
          strings build/u-boot.bin | grep -Fx 'boot_targets=usb mmc'
          strings build/u-boot.bin | grep -Fx 'bootdelay=0'
          strings build/u-boot.bin | grep -Fx 'bootcmd=bootflow scan -lb'

          echo "=== Verify compiled A21s USB host mode ==="
          dtb=$(find build -type f -name u-boot.dtb -print -quit)
          test -n "$dtb"
          test "$(fdtget -t s "$dtb" /usb@13600000/usb@0 dr_mode)" = host
          fdtget -t s "$dtb" /usb@13600000/usb@0 dr_mode

          echo "=== Build outputs ==="
          find build -type f \
            \( -name 'u-boot*' -o -name '*.dtb' -o -name '*.itb' \) \
            -print

      - name: Collect build artifacts
        if: always()
        run: |
          mkdir -p artifacts

          if [ -d source/build ]; then
            cp source/build/.config \
              artifacts/uboot.config 2>/dev/null || true

            find source/build -type f \
              \( -name 'u-boot.bin' \
              -o -name 'u-boot-dtb.bin' \
              -o -name 'u-boot-nodtb.bin' \
              -o -name 'u-boot.dtb' \
              -o -name 'u-boot.itb' \
              -o -name 'u-boot.img' \
              -o -name '*.map' \) \
              -exec cp -v {} artifacts/ \; || true
          fi

          if [ -f source/dts/upstream/src/arm64/exynos/exynos850-a217f.dts ]; then
            cp source/dts/upstream/src/arm64/exynos/exynos850-a217f.dts \
              artifacts/
          fi

          if [ -f source-commit.txt ]; then
            cp source-commit.txt artifacts/
          fi

          if [ -f source-description.txt ]; then
            cp source-description.txt artifacts/
          fi

          if [ -f inspection.log ]; then
            cp inspection.log artifacts/
          fi

          {
            echo "Device: Samsung Galaxy A21s SM-A217F"
            echo "SoC: Exynos 850"
            echo "RAM variant: 3 GB"
            echo "Autoboot: automatic scan of USB mass storage first, then MMC"
            echo "USB controller: forced host mode for A21s OTG port"
            echo "System counter: 26000000 Hz fallback for Samsung boot firmware"
            echo "U-Boot environment: RAM-only; no eMMC save"
            echo "Interactive buttons: not required for autoboot"
            echo "Build is experimental; not verified for flashing."
            echo "Date (UTC): $(date -u +%FT%TZ)"
            echo
            echo "Available artifacts:"
            ls -lh artifacts/ || true
          } > artifacts/build-info.txt

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a21s-exynos850-uboot
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Print compiler cache statistics
        if: always()
        run: |
          ccache -s || true
          
