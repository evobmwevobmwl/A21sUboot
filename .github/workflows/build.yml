
name: A21s U-Boot Research Build

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build.yml"

permissions:
  contents: read

concurrency:
  group: a21s-uboot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout workflow
        uses: actions/checkout@v4

      - name: Show runner resources
        run: |
          nproc
          free -h
          df -h /

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            bc bison flex libssl-dev \
            libgnutls28-dev device-tree-compiler \
            python3 python3-dev python3-setuptools \
            swig git ccache

      - name: Enable compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: uboot-ccache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            uboot-ccache-${{ runner.os }}-

      - name: Configure ccache
        run: |
          echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"
          ccache --set-config=max_size=2G
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> "$GITHUB_ENV"
          echo "CC=ccache aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Clone community U-Boot
        run: |
          git clone --depth=1 \
            https://github.com/samsungexynos850/u-boot.git \
            source
          git -C source log -1 --format='%H %s' \
            | tee source-commit.txt

      - name: Inspect configs and device trees
        run: |
          cd source
          {
            echo "=== Exynos mobile config ==="
            test -f configs/exynos-mobile_defconfig \
              && echo FOUND || echo MISSING
            echo "=== Exynos850 DTS candidates ==="
            find arch/arm/dts -type f \
              | grep -Ei 'e850|exynos850|a217' || true
            echo "=== Config candidates ==="
            find configs -maxdepth 1 -type f \
              | grep -Ei 'exynos.*(850|mobile)' || true
          } | tee ../inspection.log

      - name: Build generic Exynos mobile target
        run: |
          set -euxo pipefail
          cd source
          test -f configs/exynos-mobile_defconfig
          make O=build exynos-mobile_defconfig
          DTS="$(find arch/arm/dts -type f \
            -name '*e850-96*.dts' -print -quit)"
          if [ -z "$DTS" ]; then
            echo "No E850-96 DTS found; refusing to guess target"
            exit 2
          fi
          DEVICE_TREE="${DTS##*/}"
          DEVICE_TREE="${DEVICE_TREE%.dts}"
          make O=build \
            DEVICE_TREE="$DEVICE_TREE" \
            -j"$(nproc)"
          mkdir -p ../artifacts
          cp build/u-boot.bin ../artifacts/
          cp build/.config ../artifacts/uboot.config
          cp "$DTS" ../artifacts/
          ccache -s | tee ../artifacts/ccache-stats.txt

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a21s-uboot-diagnostics
          path: |
            inspection.log
            source-commit.txt
            source/build/.config
          if-no-files-found: ignore

      - name: Upload binaries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: exynos850-test-build
          path: artifacts/
          if-no-fil
          es-found: error
