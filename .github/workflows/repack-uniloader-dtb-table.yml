name: Repack A21s uniLoader with Samsung DT table

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful build containing a21s-uniloader-alpine-boot
        required: true
        default: '41187097488'
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: a21s-dt-table-repack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repack:
    name: Repackage verified uniLoader payload with Android DT table
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MKBOOTIMG_COMMIT: d3e0acd56e80dba7cfa5b9240d731c7bf00045bd

    steps:
      - name: Checkout A21sUboot
        uses: actions/checkout@v4

      - name: Download previously built kernel, DTB and uniLoader image
        uses: actions/download-artifact@v4
        with:
          name: a21s-uniloader-alpine-boot
          path: source
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}

      - name: Fetch pinned AOSP mkbootimg
        run: |
          set -euxo pipefail
          git init mkbootimg
          git -C mkbootimg remote add origin \
            https://android.googlesource.com/platform/system/tools/mkbootimg
          git -C mkbootimg fetch --depth=1 origin "$MKBOOTIMG_COMMIT"
          git -C mkbootimg checkout --detach FETCH_HEAD

      - name: Wrap A21s FDT in the single-entry Android DT table
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 - <<'PY'
          from pathlib import Path
          import os
          import struct

          source = Path("source")
          old = (source / "boot-uniloader-a21s-alpine.img").read_bytes()
          assert old[:8] == b"ANDROID!"
          kernel_size, kernel_addr = struct.unpack_from("<II", old, 8)
          ramdisk_size, _ = struct.unpack_from("<II", old, 16)
          second_size, _ = struct.unpack_from("<II", old, 24)
          page_size = struct.unpack_from("<I", old, 36)[0]
          version = struct.unpack_from("<I", old, 40)[0]
          assert version == 2 and page_size == 2048
          assert kernel_addr == 0x80080000 and ramdisk_size == 0 and second_size == 0

          def align(value, page):
              return (value + page - 1) // page * page

          old_dtb_size = struct.unpack_from("<I", old, 1648)[0]
          dtb_start = page_size + align(kernel_size, page_size) \
              + align(ramdisk_size, page_size) + align(second_size, page_size)
          old_external_dtb = old[dtb_start:dtb_start + old_dtb_size]
          assert old_external_dtb[:4] == bytes.fromhex("d00dfeed"), \
              "Expected the source image's outer DTB to be a raw FDT"

          payload = old[page_size:page_size + kernel_size]
          for name in ("Image", "exynos850-a217f.dtb", "initramfs.cpio.gz"):
              assert (source / name).read_bytes() in payload, \
                  f"{name} is missing from the uniLoader payload"

          fdt = (source / "exynos850-a217f.dtb").read_bytes()
          assert fdt[:4] == bytes.fromhex("d00dfeed")
          fdt_size = struct.unpack_from(">I", fdt, 4)[0]
          assert 40 <= fdt_size <= len(fdt)
          fdt = fdt[:fdt_size]

          # Header and entry match the A21s probe image that reached uniLoader.
          table = struct.pack(">8I", 0xd7b7ab1e, 64 + fdt_size, 32, 32, 1, 32, 2048, 0)
          table += struct.pack(">8I", fdt_size, 64, 0, 0, 0, 0xff000000, 0, 0)
          table += fdt
          table += bytes((-len(table)) % 2048)

          table_path = Path("artifacts/exynos850-a217f-dtb-table.img")
          table_path.write_bytes(table)
          loader_path = Path(os.environ["RUNNER_TEMP"]) / "uniLoader.raw"
          loader_path.write_bytes(payload)
          print(f"Verified uniLoader payload: {len(payload)} bytes")
          print(f"Created Android DT table: {len(table)} bytes; raw FDT: {fdt_size} bytes")
          PY

      - name: Package corrected Android Boot v2 image
        run: |
          set -euxo pipefail
          python3 mkbootimg/mkbootimg.py \
            --kernel "$RUNNER_TEMP/uniLoader.raw" \
            --dtb artifacts/exynos850-a217f-dtb-table.img \
            --header_version 2 \
            --pagesize 2048 \
            --base 0x10000000 \
            --kernel_offset 0x70080000 \
            --ramdisk_offset 0x01000000 \
            --second_offset 0x00f00000 \
            --tags_offset 0x100 \
            --dtb_offset 0x01f00000 \
            --board exynos850 \
            --output artifacts/boot-uniloader-a21s-alpine-dt-table.img

          python3 - <<'PY'
          from pathlib import Path
          import struct

          image = Path("artifacts/boot-uniloader-a21s-alpine-dt-table.img")
          data = image.read_bytes()
          assert data[:8] == b"ANDROID!"
          kernel_size, kernel_addr = struct.unpack_from("<II", data, 8)
          ramdisk_size = struct.unpack_from("<I", data, 16)[0]
          second_size = struct.unpack_from("<I", data, 24)[0]
          tags_addr, page_size, version = struct.unpack_from("<III", data, 32)
          dtb_size = struct.unpack_from("<I", data, 1648)[0]
          dtb_addr = struct.unpack_from("<Q", data, 1652)[0]
          assert version == 2 and page_size == 2048
          assert kernel_addr == 0x80080000 and ramdisk_size == 0 and second_size == 0
          assert dtb_addr == 0x11f00000
          assert image.stat().st_size <= 36 * 1024 * 1024

          align = lambda value, page: (value + page - 1) // page * page
          offset = page_size + align(kernel_size, page_size) \
              + align(ramdisk_size, page_size) + align(second_size, page_size)
          table = data[offset:offset + dtb_size]
          magic, total, hdr_size, entry_size, count, entries_offset, table_page, table_version = \
              struct.unpack_from(">8I", table)
          assert (magic, hdr_size, entry_size, count, entries_offset, table_page, table_version) == \
              (0xd7b7ab1e, 32, 32, 1, 32, 2048, 0)
          fdt_size, fdt_offset, dt_id, dt_rev, custom0, custom1, custom2, custom3 = \
              struct.unpack_from(">8I", table, 32)
          assert total == 64 + fdt_size and fdt_offset == 64
          assert custom1 == 0xff000000
          assert table[fdt_offset:fdt_offset + 4] == bytes.fromhex("d00dfeed")
          print(f"Android boot v2; DT table magic={magic:08x}; FDT bytes={fdt_size}; "
                f"image={image.stat().st_size} bytes; tags=0x{tags_addr:x}")
          PY

      - name: Collect recovery metadata
        if: always()
        run: |
          cp source/Image source/exynos850-a217f.dtb source/initramfs.cpio.gz artifacts/ 2>/dev/null || true
          cp source/kernel-commit.txt source/uniloader-commit.txt artifacts/ 2>/dev/null || true
          {
            echo 'Target: Samsung Galaxy A21s SM-A217F, 3 GB RAM'
            echo 'Path: Samsung Boot -> uniLoader -> mainline Linux -> Alpine'
            echo 'The outer DTB is wrapped in a single-entry Android DT table (magic d7b7ab1e).'
            echo 'This fixes the raw-FDT outer header that triggered FDT_ERR_BADMAGIC.'
            echo 'Flash target: Boot partition only. Never Recovery, BL or DTBO.'
            echo 'The corrected image still needs a physical boot test.'
            echo
            ls -lh artifacts/ || true
          } > artifacts/README-BOOT-RU.txt
          if [ -f artifacts/boot-uniloader-a21s-alpine-dt-table.img ]; then
            sha256sum artifacts/boot-uniloader-a21s-alpine-dt-table.img > artifacts/SHA256SUMS
          fi

      - name: Upload corrected A21s Boot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a21s-uniloader-alpine-boot-dt-table
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
