name: Build A21s Alpine image through uniLoader

on:
  workflow_dispatch:
    inputs:
      alpine_run_id:
        description: Successful run containing alpine-aarch64-rootfs
        required: true
        default: '40764327953'
        type: string
      reuse_payload_run_id:
        description: Reuse a kernel artifact and build the source-gated OTG image without rebuilding the kernel
        required: false
        default: ''
        type: string
  push:
    paths:
      - .github/workflows/build-uniloader.yml

permissions:
  actions: read
  contents: read

env:
  A21S_FIRMWARE_COMMIT: 71ad9141a18a7599510796cfeef6d5d33a4ac3b9
  A21S_FIRMWARE_SHA512: a9624ddaebe4885eedb81984f54f05c65d68114a371a5711878289380476f2ce710cfa96fb6ffc8d7ce2889715669009f48368344ac5095114d452a23549c465

concurrency:
  group: a21s-alpine-uniloader-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build SM-A217F mainline kernel and Alpine boot image
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.reuse_payload_run_id == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      KERNEL_COMMIT: cad9d83aeb26da2df00b435f6c11b6e113dd4345
      UNILOADER_COMMIT: 06a1bba90f6f00f4a3f745eb072c54e2190c0832
      MKBOOTIMG_COMMIT: d3e0acd56e80dba7cfa5b9240d731c7bf00045bd
      ALPINE_RUN_ID: ${{ inputs.alpine_run_id || '40764327953' }}

    steps:
      - name: Checkout A21sUboot
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            binutils-aarch64-linux-gnu \
            bison \
            build-essential \
            cpio \
            curl \
            device-tree-compiler \
            dwarves \
            flex \
            gcc-aarch64-linux-gnu \
            gzip \
            libc6-dev-arm64-cross \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            python3 \
            rsync

      - name: Fetch pinned A21s mainline kernel source
        run: |
          set -euxo pipefail
          git init linux
          git -C linux remote add origin https://github.com/samsungexynos850/linux.git
          git -C linux fetch --depth=1 origin "$KERNEL_COMMIT"
          git -C linux checkout --detach FETCH_HEAD
          git -C linux rev-parse HEAD | tee kernel-commit.txt
          test -f linux/arch/arm64/configs/fragments/exynos850-a217f.config
          test -f linux/arch/arm64/boot/dts/exynos/exynos850-a217f.dts
          test "$(make -s -C linux ARCH=arm64 kernelversion)" = "7.3.0"

      - name: Apply A21s USB host and touchscreen DT settings
        run: |
          set -euxo pipefail
          python3 .github/patches/enable_a21s_usb_host.py \
            linux/arch/arm64/boot/dts/exynos/exynos850-a217f.dts

      - name: Configure compact A21s kernel with USB host and F2FS
        run: |
          set -euxo pipefail
          cd linux

          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          scripts/kconfig/merge_config.sh -m .config \
            arch/arm64/configs/fragments/exynos850-a217f.config

          scripts/config --disable CONFIG_USB_DWC3_HOST
          scripts/config --disable CONFIG_USB_DWC3_GADGET
          scripts/config --enable CONFIG_USB_DWC3_DUAL_ROLE
          scripts/config --enable CONFIG_USB_ROLE_SWITCH
          scripts/config --enable CONFIG_USB_DWC3
          scripts/config --enable CONFIG_USB_DWC3_EXYNOS
          scripts/config --enable CONFIG_USB_XHCI_HCD
          scripts/config --enable CONFIG_USB_XHCI_PLATFORM
          scripts/config --enable CONFIG_USB_STORAGE
          scripts/config --enable CONFIG_SCSI
          scripts/config --enable CONFIG_BLK_DEV_SD

          scripts/config --enable CONFIG_MMC
          scripts/config --enable CONFIG_MMC_BLOCK
          scripts/config --enable CONFIG_MMC_DW
          scripts/config --enable CONFIG_MMC_DW_EXYNOS

          scripts/config --enable CONFIG_EXT4_FS
          scripts/config --enable CONFIG_F2FS_FS
          scripts/config --enable CONFIG_VFAT_FS
          scripts/config --enable CONFIG_EXFAT_FS
          scripts/config --enable CONFIG_NLS_CODEPAGE_437
          scripts/config --enable CONFIG_NLS_ISO8859_1

          scripts/config --enable CONFIG_BLK_DEV_INITRD
          scripts/config --enable CONFIG_DEVTMPFS
          scripts/config --enable CONFIG_DEVTMPFS_MOUNT
          scripts/config --enable CONFIG_DRM_SIMPLEDRM
          scripts/config --enable CONFIG_FRAMEBUFFER_CONSOLE
          scripts/config --enable CONFIG_VT
          scripts/config --enable CONFIG_VT_CONSOLE
          scripts/config --set-str CONFIG_CMDLINE "console=tty0 loglevel=8 ignore_loglevel"
          scripts/config --enable CONFIG_CMDLINE_FORCE

          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

          cp .config "$GITHUB_WORKSPACE/kernel.config"
          grep -E '^(CONFIG_(USB_DWC3_DUAL_ROLE|USB_ROLE_SWITCH|USB_DWC3_EXYNOS|USB_STORAGE|SCSI|BLK_DEV_SD|MMC_DW_EXYNOS|EXT4_FS|F2FS_FS|VFAT_FS|EXFAT_FS|DEVTMPFS|DEVTMPFS_MOUNT|FRAMEBUFFER_CONSOLE|CMDLINE_FORCE))=' \
            .config | tee "$GITHUB_WORKSPACE/kernel-config-selected.txt"

          for option in \
            CONFIG_USB_DWC3_DUAL_ROLE \
            CONFIG_USB_ROLE_SWITCH \
            CONFIG_USB_DWC3_EXYNOS \
            CONFIG_USB_STORAGE \
            CONFIG_SCSI \
            CONFIG_BLK_DEV_SD \
            CONFIG_MMC_DW_EXYNOS \
            CONFIG_EXT4_FS \
            CONFIG_F2FS_FS \
            CONFIG_VFAT_FS \
            CONFIG_EXFAT_FS \
            CONFIG_DEVTMPFS \
            CONFIG_DEVTMPFS_MOUNT \
            CONFIG_FRAMEBUFFER_CONSOLE \
            CONFIG_CMDLINE_FORCE; do
            grep -qx "$option=y" .config || {
              echo "::error::$option was not enabled after olddefconfig"
              exit 1
            }
          done

          if grep -qx 'CONFIG_USB_DWC3_GADGET=y' .config; then
            echo "::error::DWC3 remained gadget-only instead of dual-role."
            exit 1
          fi

      - name: Build A21s kernel and device tree
        run: |
          set -euxo pipefail
          make -C linux -j"$(nproc)" \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            Image dtbs

          test -s linux/arch/arm64/boot/Image
          test -s linux/arch/arm64/boot/dts/exynos/exynos850-a217f.dtb
          file linux/arch/arm64/boot/Image \
            linux/arch/arm64/boot/dts/exynos/exynos850-a217f.dtb
          sha256sum linux/arch/arm64/boot/Image \
            linux/arch/arm64/boot/dts/exynos/exynos850-a217f.dtb

      - name: Download Alpine ARM64 rootfs artifact
        uses: actions/download-artifact@v4
        with:
          name: alpine-aarch64-rootfs
          path: alpine-artifact
          repository: ${{ github.repository }}
          run-id: ${{ env.ALPINE_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Prepare uniLoader blob directory
        run: mkdir -p uniloader/blob

      - name: Stage kernel and create Alpine eMMC/USB initramfs
        run: |
          set -euo pipefail

          rootfs_tar="$(find alpine-artifact -type f \
            \( -name alpine-minirootfs.tar.gz -o -name rootfs.tar.gz \) \
            -print -quit)"
          if [ -z "$rootfs_tar" ]; then
            echo "::error::Alpine ARM64 rootfs tarball was not found."
            find alpine-artifact -maxdepth 4 -type f -print | sort
            exit 1
          fi

          work="$RUNNER_TEMP/alpine-initramfs"
          alpine="$RUNNER_TEMP/alpine-rootfs"
          mkdir -p "$work"/{bin,lib,dev,proc,sys,mnt,run,newroot,newroot-bind}
          mkdir -p "$alpine"
          tar -xzf "$rootfs_tar" -C "$alpine"

          firmware="$RUNNER_TEMP/td4150_a21s.bin"
          curl -fL --retry 3 \
            "https://raw.githubusercontent.com/samsungexynos850/firmware-samsung-a21s/$A21S_FIRMWARE_COMMIT/td4150_a21s.bin" \
            -o "$firmware"
          printf '%s  %s\n' "$A21S_FIRMWARE_SHA512" "$firmware" | sha512sum -c -
          mkdir -p "$work/lib/firmware"
          install -m 0644 "$firmware" "$work/lib/firmware/td4150_a21s.bin"
          aarch64-linux-gnu-gcc -Os -static -s \
            .github/patches/a21s-otg-init.c \
            -o "$work/bin/a21s-otg-init"
          file "$work/bin/a21s-otg-init" "$work/lib/firmware/td4150_a21s.bin"

          test -x "$alpine/bin/busybox"
          test -e "$alpine/lib/ld-musl-aarch64.so.1"
          test -e "$alpine/lib/libc.musl-aarch64.so.1"
          cp -a "$alpine/bin/busybox" "$work/bin/busybox"
          cp -a "$alpine/lib/ld-musl-aarch64.so.1" "$work/lib/"
          cp -a "$alpine/lib/libc.musl-aarch64.so.1" "$work/lib/"

          cat > "$work/init" <<'INIT'
          #!/bin/busybox sh

          PATH=/bin:/sbin
          export PATH

          /bin/busybox mount -t devtmpfs devtmpfs /dev 2>/dev/null || true
          /bin/busybox mount -t proc proc /proc 2>/dev/null || true
          /bin/busybox mount -t sysfs sysfs /sys 2>/dev/null || true
          /bin/busybox mkdir -p /mnt/source /newroot /newroot-bind /run
          /bin/busybox sleep 1
          tries=0
          while [ ! -c /dev/i2c-0 ] && [ "$tries" -lt 5 ]; do
            /bin/busybox sleep 1
            tries=$((tries + 1))
          done
          /bin/a21s-otg-init >/run/a21s-otg-status 2>&1 || true
          /bin/busybox cat /run/a21s-otg-status >/dev/console 2>&1 || true
          echo '[A21s] Linux initramfs started; scanning eMMC, SD and USB storage' >/dev/console

          is_emmc() {
            block="$(/bin/busybox basename "$1")"
            case "$block" in
              mmcblk*p[0-9]*) parent="$(printf '%s' "$block" | /bin/busybox sed 's/p[0-9]*$//')" ;;
              mmcblk[0-9]*) parent="$block" ;;
              *) return 1 ;;
            esac
            type="$(/bin/busybox cat "/sys/class/block/$parent/device/type" 2>/dev/null)"
            [ "$type" = "MMC" ] || [ "$parent" = "mmcblk0" ]
          }

          finish_root() {
            rootdir="$1"
            /bin/busybox mkdir -p "$rootdir/dev" "$rootdir/proc" \
              "$rootdir/sys" "$rootdir/run"
            echo '[A21s] Starting Alpine /sbin/init' >/dev/console
            /bin/busybox mount --move /dev "$rootdir/dev" 2>/dev/null || true
            /bin/busybox mount --move /proc "$rootdir/proc" 2>/dev/null || true
            /bin/busybox mount --move /sys "$rootdir/sys" 2>/dev/null || true
            /bin/busybox switch_root "$rootdir" /sbin/init
            echo '[A21s] switch_root failed; dropping to initramfs shell' >/dev/console
            exec /bin/busybox sh
          }

          copy_root_to_ram() {
            source_root="$1"
            /bin/busybox mount -t tmpfs -o size=768M alpine-root /newroot || return 1
            if ! /bin/busybox tar -C "$source_root" -cpf - . \
                | /bin/busybox tar -C /newroot -xpf -; then
              /bin/busybox umount /newroot
              return 1
            fi
            /bin/busybox umount /mnt/source 2>/dev/null || true
            finish_root /newroot
          }

          switch_from_storage() {
            source_root="$1"
            source_dev="$2"
            if is_emmc "$source_dev"; then
              echo "[A21s] Alpine directory found on internal eMMC ($source_dev); copying to RAM" >/dev/console
              copy_root_to_ram "$source_root"
              return $?
            fi

            /bin/busybox mount -o remount,rw /mnt/source 2>/dev/null || true
            if [ "$source_root" = /mnt/source ]; then
              finish_root /mnt/source
            fi
            /bin/busybox mount --bind "$source_root" /newroot-bind || return 1
            finish_root /newroot-bind
          }

          boot_from_archive() {
            archive="$1"
            echo "[A21s] Extracting Alpine archive: $archive" >/dev/console
            /bin/busybox mount -t tmpfs -o size=768M alpine-root /newroot || return 1
            if ! /bin/busybox tar -xzf "$archive" -C /newroot; then
              /bin/busybox umount /newroot
              return 1
            fi
            /bin/busybox umount /mnt/source 2>/dev/null || true

            if [ -x /newroot/sbin/init ]; then
              finish_root /newroot
            fi
            if [ -x /newroot/alpine/sbin/init ]; then
              /bin/busybox mount --bind /newroot/alpine /newroot-bind || return 1
              finish_root /newroot-bind
            fi
            if [ -x /newroot/rootfs/sbin/init ]; then
              /bin/busybox mount --bind /newroot/rootfs /newroot-bind || return 1
              finish_root /newroot-bind
            fi

            echo '[A21s] Archive has no Alpine /sbin/init' >/dev/console
            /bin/busybox umount /newroot
            return 1
          }

          find_archive() {
            search_root="$1"
            archive=""
            for path in \
              "$search_root/rootfs.tar.gz" \
              "$search_root/alpine-minirootfs.tar.gz" \
              "$search_root/alpine-rootfs.tar.gz" \
              "$search_root/local/rootfs.tar.gz" \
              "$search_root/local/tmp/rootfs.tar.gz" \
              "$search_root/local/alpine/rootfs.tar.gz" \
              "$search_root/media/0/Download/rootfs.tar.gz"; do
              if [ -f "$path" ]; then
                archive="$path"
                break
              fi
            done

            if [ -z "$archive" ] && [ -d "$search_root/local" ]; then
              archive="$(/bin/busybox find "$search_root/local" -maxdepth 5 \
                -type f \( -iname 'rootfs.tar.gz' \
                -o -iname 'alpine-minirootfs*.tar.gz' \
                -o -iname 'alpine-rootfs*.tar.gz' \) -print -quit 2>/dev/null)"
            fi
            if [ -z "$archive" ] && [ -d "$search_root/media/0/Download" ]; then
              archive="$(/bin/busybox find "$search_root/media/0/Download" \
                -maxdepth 3 -type f \( -iname 'rootfs.tar.gz' \
                -o -iname 'alpine-minirootfs*.tar.gz' \
                -o -iname 'alpine-rootfs*.tar.gz' \) -print -quit 2>/dev/null)"
            fi
            if [ -z "$archive" ] && ! is_emmc "$current_dev"; then
              archive="$(/bin/busybox find "$search_root" -maxdepth 4 \
                -type f \( -iname 'rootfs.tar.gz' \
                -o -iname 'alpine-minirootfs*.tar.gz' \
                -o -iname 'alpine-rootfs*.tar.gz' \) -print -quit 2>/dev/null)"
            fi
            printf '%s' "$archive"
          }

          attempt=0
          while [ "$attempt" -lt 20 ]; do
          for dev in /dev/sd* /dev/mmcblk[0-9] /dev/mmcblk[0-9]p*; do
              [ -b "$dev" ] || continue

              for fs in ext4 f2fs vfat exfat; do
                case "$fs" in
                  ext4) opts=ro,noload ;;
                  f2fs) opts=ro,norecovery ;;
                  *) opts=ro ;;
                esac

                if ! /bin/busybox mount -t "$fs" -o "$opts" \
                    "$dev" /mnt/source 2>/dev/null; then
                  continue
                fi

                for candidate in \
                  /mnt/source \
                  /mnt/source/alpine \
                  /mnt/source/rootfs \
                  /mnt/source/local/alpine \
                  /mnt/source/data/local/alpine; do
                  if [ -x "$candidate/sbin/init" ]; then
                    echo "[A21s] Found Alpine on $dev ($fs)" >/dev/console
                    switch_from_storage "$candidate" "$dev"
                  fi
                done

                current_dev="$dev"
                archive="$(find_archive /mnt/source)"
                if [ -n "$archive" ]; then
                  echo "[A21s] Found rootfs archive on $dev ($fs)" >/dev/console
                  boot_from_archive "$archive"
                fi

                /bin/busybox umount /mnt/source
              done
            done
            attempt=$((attempt + 1))
            /bin/busybox sleep 1
          done

          echo '[A21s] Alpine not found. Check that the rootfs is extracted or rootfs.tar.gz is present.' >/dev/console
          echo '[A21s] Emergency shell: inspect /dev, /sys/class/block and mount manually.' >/dev/console
          echo '[A21s] OTG/VBUS status:' >/dev/console
          /bin/busybox cat /run/a21s-otg-status >/dev/console 2>&1 || true
          echo '[A21s] USB block devices:' >/dev/console
          for block in /sys/class/block/sd*; do
            [ -e "$block" ] || continue
            echo "  $(/bin/busybox basename "$block")" >/dev/console
          done
          echo '[A21s] Registered input event devices:' >/dev/console
          for event in /sys/class/input/event*; do
            [ -e "$event" ] || continue
            name="$(/bin/busybox cat "$event/device/name" 2>/dev/null)"
            echo "  $(/bin/busybox basename "$event"): $name" >/dev/console
          done
          exec /bin/busybox sh
          INIT
          chmod 0755 "$work/init"

          (
            cd "$work"
            find . -print0 | LC_ALL=C sort -z \
              | cpio --null --create --format=newc --owner=0:0 --quiet
          ) | gzip -n -9 > uniloader/blob/ramdisk

          cp linux/arch/arm64/boot/Image uniloader/blob/Image
          cp linux/arch/arm64/boot/dts/exynos/exynos850-a217f.dtb \
            uniloader/blob/dtb
          file uniloader/blob/Image uniloader/blob/dtb uniloader/blob/ramdisk
          sha256sum uniloader/blob/Image uniloader/blob/dtb \
            uniloader/blob/ramdisk

      - name: Fetch pinned uniLoader source
        run: |
          set -euxo pipefail
          git init uniloader
          git -C uniloader remote add origin \
            https://github.com/samsungexynos850/uniLoader.git
          git -C uniloader fetch --depth=1 origin "$UNILOADER_COMMIT"
          git -C uniloader checkout --detach FETCH_HEAD
          git -C uniloader rev-parse HEAD | tee uniloader-commit.txt
          test -f uniloader/configs/a21s_defconfig

      - name: Configure and build uniLoader for A21s
        run: |
          set -euxo pipefail
          build_dir="$RUNNER_TEMP/uniloader-build"
          mkdir -p "$build_dir"

          make -C uniloader \
            O="$build_dir" \
            ARCH=aarch64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            a21s_defconfig
          cp "$build_dir/.config" uniloader.config

          make -C uniloader \
            O="$build_dir" \
            ARCH=aarch64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            -j"$(nproc)"

          test -s "$build_dir/uniLoader"
          file "$build_dir/uniLoader"
          stat -c 'uniLoader raw size: %s bytes' "$build_dir/uniLoader"

      - name: Fetch pinned AOSP mkbootimg and package Android Boot v2
        run: |
          set -euxo pipefail
          git init mkbootimg
          git -C mkbootimg remote add origin \
            https://android.googlesource.com/platform/system/tools/mkbootimg
          git -C mkbootimg fetch --depth=1 origin "$MKBOOTIMG_COMMIT"
          git -C mkbootimg checkout --detach FETCH_HEAD

          mkdir -p artifacts
          cp boot/a21s-sboot-compatible-dtb-table.img \
            artifacts/a21s-sboot-compatible-dtb-table.img

          python3 mkbootimg/mkbootimg.py \
            --kernel "$RUNNER_TEMP/uniloader-build/uniLoader" \
            --dtb artifacts/a21s-sboot-compatible-dtb-table.img \
            --header_version 2 \
            --pagesize 2048 \
            --base 0x10000000 \
            --kernel_offset 0x70080000 \
            --ramdisk_offset 0x01000000 \
            --second_offset 0x00f00000 \
            --tags_offset 0x100 \
            --dtb_offset 0x01f00000 \
            --board exynos850 \
            --output artifacts/boot-uniloader-a21s-alpine.img

          file artifacts/boot-uniloader-a21s-alpine.img
          python3 - <<'PY'
          import pathlib
          import struct

          image = pathlib.Path("artifacts/boot-uniloader-a21s-alpine.img")
          data = image.read_bytes()
          assert data[:8] == b"ANDROID!"
          kernel_size, kernel_addr = struct.unpack_from("<II", data, 8)
          ramdisk_size, ramdisk_addr = struct.unpack_from("<II", data, 16)
          second_size, second_addr = struct.unpack_from("<II", data, 24)
          tags_addr, page_size, header_version = struct.unpack_from("<III", data, 32)
          assert kernel_size > 0
          assert kernel_addr == 0x80080000
          assert page_size == 2048
          assert header_version == 2
          assert ramdisk_size == 0
          assert second_size == 0
          assert image.stat().st_size <= 36 * 1024 * 1024
          dtb_size = struct.unpack_from("<I", data, 1648)[0]
          dtb_addr = struct.unpack_from("<Q", data, 1652)[0]
          assert dtb_size > 0
          assert dtb_addr == 0x11F00000
          align = lambda value, page: (value + page - 1) // page * page
          dtb_start = page_size + align(kernel_size, page_size) \
              + align(ramdisk_size, page_size) + align(second_size, page_size)
          table = data[dtb_start:dtb_start + dtb_size]
          known_good_table = pathlib.Path("boot/a21s-sboot-compatible-dtb-table.img").read_bytes()
          assert table == known_good_table
          magic, total_size, header_size, entry_size, count, entries_offset, table_page, version = \
              struct.unpack_from(">8I", table)
          assert (magic, header_size, entry_size, count, entries_offset, table_page, version) == \
              (0xd7b7ab1e, 32, 32, 1, 32, 2048, 0)
          fdt_size, fdt_offset, dt_id, dt_rev, custom0, custom1, custom2, custom3 = \
              struct.unpack_from(">8I", table, 32)
          assert total_size == 64 + fdt_size
          assert fdt_offset == 64
          assert table[fdt_offset:fdt_offset + 4] == bytes.fromhex("d00dfeed")
          assert custom1 == 0xff000000
          payload = data[page_size:page_size + kernel_size]
          for path in ("linux/arch/arm64/boot/Image",
                       "linux/arch/arm64/boot/dts/exynos/exynos850-a217f.dtb",
                       "uniloader/blob/ramdisk"):
              assert pathlib.Path(path).read_bytes() in payload, f"{path} not embedded in uniLoader"
          print(f"Android boot v{header_version}; kernel={kernel_size} bytes; "
                f"addr=0x{kernel_addr:08x}; DT table={dtb_size} bytes at {dtb_addr:#x}")
          print(f"ramdisk_addr=0x{ramdisk_addr:08x}; tags_addr=0x{tags_addr:08x}; "
                f"page_size={page_size}; image={image.stat().st_size} bytes")
          PY

      - name: Collect flashable Boot image and build metadata
        if: always()
        run: |
          mkdir -p artifacts

          [ ! -f kernel-commit.txt ] || cp kernel-commit.txt artifacts/
          [ ! -f uniloader-commit.txt ] || cp uniloader-commit.txt artifacts/
          [ ! -f kernel.config ] || cp kernel.config artifacts/
          [ ! -f kernel-config-selected.txt ] || cp kernel-config-selected.txt artifacts/
          [ ! -f uniloader.config ] || cp uniloader.config artifacts/
          [ ! -f linux/arch/arm64/boot/Image ] || cp linux/arch/arm64/boot/Image artifacts/Image
          [ ! -f uniloader/blob/dtb ] || cp uniloader/blob/dtb artifacts/exynos850-a217f.dtb
          [ ! -f uniloader/blob/ramdisk ] || cp uniloader/blob/ramdisk artifacts/initramfs.cpio.gz

          {
            echo 'Target: Samsung Galaxy A21s SM-A217F, 3 GB RAM'
            echo 'Path: Samsung Android Boot v2 -> uniLoader -> mainline Linux -> Alpine'
            echo 'Kernel source commit:'
            cat kernel-commit.txt 2>/dev/null || true
            echo 'Kernel was built with A21s source config plus USB dual-role and F2FS.'
            echo 'The A21s Linux DTB selects USB host mode and enables I2C0 for S2MU106 OTG control.'
            echo 'Initramfs includes verified TD4150 firmware and scans USB storage before eMMC.'
            echo 'S2MU106 OTG boost is enabled only after the PDIC reports attached source/DFP; OCP limit is 1.2 A.'
            echo 'Charger registers are snapshotted and restored if the vendor sequence fails.'
            echo 'Rootfs archives found on storage are extracted to RAM.'
            echo 'Outer Samsung DT table is reused from the A21s probe that reached uniLoader.'
            echo 'The separate mainline A21s DTB remains embedded inside uniLoader for Linux.'
            echo 'The image is a Boot-partition test image. It is not a Recovery image.'
            echo 'Physical Linux/Alpine boot is not yet verified.'
            echo
            ls -lh artifacts/ || true
          } > artifacts/README-BOOT-RU.txt

          if [ -f artifacts/boot-uniloader-a21s-alpine.img ]; then
            sha256sum artifacts/boot-uniloader-a21s-alpine.img \
              > artifacts/SHA256SUMS
          fi

      - name: Upload A21s uniLoader Boot image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a21s-uniloader-alpine-boot
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  repack:
    name: Build A21s OTG-enabled image without rebuilding the kernel
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.reuse_payload_run_id != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      UNILOADER_COMMIT: 06a1bba90f6f00f4a3f745eb072c54e2190c0832
      MKBOOTIMG_COMMIT: d3e0acd56e80dba7cfa5b9240d731c7bf00045bd

    steps:
      - name: Checkout A21sUboot
        uses: actions/checkout@v4

      - name: Install repack and uniLoader build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            binutils-aarch64-linux-gnu \
            bison \
            build-essential \
            cpio \
            curl \
            device-tree-compiler \
            flex \
            gcc-aarch64-linux-gnu \
            gzip \
            libc6-dev-arm64-cross \
            libncurses-dev \
            libssl-dev \
            python3

      - name: Download previously built payload
        uses: actions/download-artifact@v4
        with:
          name: a21s-uniloader-alpine-boot
          path: source
          repository: ${{ github.repository }}
          run-id: ${{ inputs.reuse_payload_run_id }}
          github-token: ${{ github.token }}

      - name: Enable host DT, add touch firmware and source-gated S2MU106 OTG
        run: |
          set -euxo pipefail

          dtb=source/exynos850-a217f.dtb
          fdtput -t s "$dtb" /aliases i2c0 /soc@0/i2c@13830000
          fdtput -t s "$dtb" /soc@0/i2c@13830000 status okay
          fdtput -t u "$dtb" /soc@0/i2c@13830000 clock-frequency 100000
          fdtput -t s "$dtb" /soc@0/usb@13600000/usb@0 dr_mode host
          fdtput -t x "$dtb" \
            /soc@0/usi@11d000c0/spi@11d00000/touchscreen@0 \
            vddio-supply 19
          test "$(fdtget "$dtb" /aliases i2c0)" = /soc@0/i2c@13830000
          test "$(fdtget "$dtb" /soc@0/i2c@13830000 status)" = okay
          test "$(fdtget "$dtb" /soc@0/usb@13600000/usb@0 dr_mode)" = host
          test "$(fdtget -t x "$dtb" \
            /soc@0/usi@11d000c0/spi@11d00000/touchscreen@0 vddio-supply)" = 19

          firmware="$RUNNER_TEMP/td4150_a21s.bin"
          curl -fL --retry 3 \
            "https://raw.githubusercontent.com/samsungexynos850/firmware-samsung-a21s/$A21S_FIRMWARE_COMMIT/td4150_a21s.bin" \
            -o "$firmware"
          printf '%s  %s\n' "$A21S_FIRMWARE_SHA512" "$firmware" | sha512sum -c -

          root="$RUNNER_TEMP/a21s-initramfs"
          mkdir -p "$root"
          gzip -dc source/initramfs.cpio.gz \
            | (cd "$root" && cpio -idm --quiet --no-absolute-filenames)
          install -D -m 0644 "$firmware" "$root/lib/firmware/td4150_a21s.bin"
          aarch64-linux-gnu-gcc -Os -static -s \
            .github/patches/a21s-otg-init.c \
            -o "$root/bin/a21s-otg-init"

          python3 .github/patches/patch_a21s_initramfs.py "$root/init"

          (
            cd "$root"
            find . -print0 | LC_ALL=C sort -z \
              | cpio --null --create --format=newc --owner=0:0 --quiet
          ) | gzip -n -9 > source/initramfs.cpio.gz

          git init uniloader
          git -C uniloader remote add origin \
            https://github.com/samsungexynos850/uniLoader.git
          git -C uniloader fetch --depth=1 origin "$UNILOADER_COMMIT"
          git -C uniloader checkout --detach FETCH_HEAD
          git -C uniloader rev-parse HEAD | tee source/uniloader-commit.txt
          test -f uniloader/configs/a21s_defconfig
          cp source/Image uniloader/blob/Image
          cp "$dtb" uniloader/blob/dtb
          cp source/initramfs.cpio.gz uniloader/blob/ramdisk

          build_dir="$RUNNER_TEMP/uniloader-build"
          mkdir -p "$build_dir"
          make -C uniloader O="$build_dir" ARCH=aarch64 \
            CROSS_COMPILE=aarch64-linux-gnu- a21s_defconfig
          make -C uniloader O="$build_dir" ARCH=aarch64 \
            CROSS_COMPILE=aarch64-linux-gnu- -j"$(nproc)"
          test -s "$build_dir/uniLoader"
          file "$build_dir/uniLoader" "$dtb" source/initramfs.cpio.gz
          sha256sum "$build_dir/uniLoader" "$dtb" source/initramfs.cpio.gz

      - name: Fetch pinned AOSP mkbootimg
        run: |
          set -euxo pipefail
          git init mkbootimg
          git -C mkbootimg remote add origin \
            https://android.googlesource.com/platform/system/tools/mkbootimg
          git -C mkbootimg fetch --depth=1 origin "$MKBOOTIMG_COMMIT"
          git -C mkbootimg checkout --detach FETCH_HEAD

      - name: Package OTG-enabled uniLoader with the proven Samsung outer DT table
        run: |
          set -euxo pipefail
          mkdir -p artifacts
          cp boot/a21s-sboot-compatible-dtb-table.img artifacts/
          python3 - <<'PY'
          from pathlib import Path
          import os
          import struct

          source = Path("source")
          payload = Path(os.environ["RUNNER_TEMP"], "uniloader-build", "uniLoader").read_bytes()
          for name in ("Image", "exynos850-a217f.dtb", "initramfs.cpio.gz"):
              assert (source / name).read_bytes() in payload, \
                  f"{name} is missing from the rebuilt uniLoader payload"
          Path(os.environ["RUNNER_TEMP"], "uniLoader.raw").write_bytes(payload)

          page_size = 2048
          table = Path("boot/a21s-sboot-compatible-dtb-table.img").read_bytes()
          assert len(table) % page_size == 0
          assert struct.unpack_from(">I", table, 0)[0] == 0xd7b7ab1e
          print(f"Using {len(payload)}-byte rebuilt uniLoader and {len(table)}-byte known-good outer DT table")
          PY

          python3 mkbootimg/mkbootimg.py \
            --kernel "$RUNNER_TEMP/uniLoader.raw" \
            --dtb artifacts/a21s-sboot-compatible-dtb-table.img \
            --header_version 2 \
            --pagesize 2048 \
            --base 0x10000000 \
            --kernel_offset 0x70080000 \
            --ramdisk_offset 0x01000000 \
            --second_offset 0x00f00000 \
            --tags_offset 0x100 \
            --dtb_offset 0x01f00000 \
            --board exynos850 \
            --output artifacts/boot-uniloader-a21s-alpine-otg-enabled.img

          python3 - <<'PY'
          from pathlib import Path
          import struct

          image = Path("artifacts/boot-uniloader-a21s-alpine-otg-enabled.img")
          data = image.read_bytes()
          kernel_size, kernel_addr = struct.unpack_from("<II", data, 8)
          ramdisk_size = struct.unpack_from("<I", data, 16)[0]
          second_size = struct.unpack_from("<I", data, 24)[0]
          page_size = struct.unpack_from("<I", data, 36)[0]
          version = struct.unpack_from("<I", data, 40)[0]
          dtb_size = struct.unpack_from("<I", data, 1648)[0]
          dtb_addr = struct.unpack_from("<Q", data, 1652)[0]
          assert data[:8] == b"ANDROID!"
          assert (version, page_size, kernel_addr, ramdisk_size, second_size) == \
              (2, 2048, 0x80080000, 0, 0)
          assert dtb_addr == 0x11f00000
          assert image.stat().st_size <= 36 * 1024 * 1024

          def align(value, page):
              return (value + page - 1) // page * page

          start = page_size + align(kernel_size, page_size) \
              + align(ramdisk_size, page_size) + align(second_size, page_size)
          outer = data[start:start + dtb_size]
          known_good = Path("boot/a21s-sboot-compatible-dtb-table.img").read_bytes()
          assert outer == known_good
          magic, total, hsize, esize, count, entries, table_page, tversion = \
              struct.unpack_from(">8I", outer)
          assert (magic, hsize, esize, count, entries, table_page, tversion) == \
              (0xd7b7ab1e, 32, 32, 1, 32, 2048, 0)
          fdt_size, fdt_offset, dt_id, dt_rev, c0, c1, c2, c3 = \
              struct.unpack_from(">8I", outer, 32)
          assert total == 64 + fdt_size and fdt_offset == 64 and c1 == 0xff000000
          assert outer[fdt_offset:fdt_offset + 4] == bytes.fromhex("d00dfeed")
          print(f"Boot v2; Samsung DT table verified; FDT={fdt_size}; image={image.stat().st_size} bytes")
          PY

      - name: Collect repack metadata
        if: always()
        run: |
          mkdir -p artifacts
          cp source/Image source/exynos850-a217f.dtb source/initramfs.cpio.gz artifacts/ 2>/dev/null || true
          cp source/kernel-commit.txt source/uniloader-commit.txt artifacts/ 2>/dev/null || true
          {
            echo 'Outer DT table: exact table from the A21s probe that reached uniLoader.'
            echo 'The existing Linux Image is reused; the kernel was not rebuilt.'
            echo 'uniLoader was rebuilt with DWC3 forced to host mode and I2C0 enabled.'
            echo 'Initramfs contains verified A21s touchscreen firmware.'
            echo 'S2MU106 VBUS boost is enabled only if PDIC confirms source/DFP; OCP is limited to 1.2 A.'
            echo 'The charger is restored to its saved register state if the vendor setup sequence fails.'
            echo 'A21s touchscreen vddio uses the existing dummy regulator entry.'
            echo 'This is a Boot-partition diagnostic image, not a Recovery image.'
            ls -lh artifacts/ || true
          } > artifacts/README-BOOT-RU.txt
          if [ -f artifacts/boot-uniloader-a21s-alpine-otg-enabled.img ]; then
            sha256sum artifacts/boot-uniloader-a21s-alpine-otg-enabled.img > artifacts/SHA256SUMS
          fi

      - name: Upload A21s OTG-enabled Boot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a21s-uniloader-alpine-otg-enabled
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
